<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">

 <script>
  window.tokenGoogle = null;

  window.receberCredencialGoogle = function (resposta) {
    window.tokenGoogle = resposta.credential;

    const mensagem = document.getElementById("mensagem");

    if (mensagem) {
      mensagem.textContent =
        "Login realizado com sucesso! Agora você pode gerar o desenho.";
    }
  };
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>


</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100.
        Cada número gera uma figura diferente, assinada com o seu e-mail.
      </p>
    </header>

    <!-- Login com Google -->
    <div id="g_id_onload"
         data-client_id="32708424806-pmj4u4u7v99t9n3qt8b8v9l64nqtp1u0.apps.googleusercontent.com"
         data-callback="receberCredencialGoogle"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number"
             min="1" max="100" step="1" required
             placeholder="42">

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>
      Baixar SVG
    </button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
